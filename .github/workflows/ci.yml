#
#      - name: Lint
#        uses: golangci/golangci-lint-action@v9.3.0
#        with:
#          version: v2.5.0

  deploy:
    needs: [test, build]
    environment: amazon-lambda
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build archive
        run: make aws_lambda

      - name: Check deploy inputs
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          missing=0
          for name in AWS_ROLE_ARN AWS_REGION LAMBDA_FUNCTION_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty in the Amazon Lambda environment"
              missing=1
            fi
          done
          exit $missing

      - name: Print OIDC claims (debug)
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          payload=$(printf '%s' "$token" | cut -d. -f2)
          python3 -c 'import base64,json,sys; p=sys.argv[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print({k: c.get(k) for k in ("iss", "aud", "sub")})' "$payload"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        env:
          FUNCTION: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://archive.zip
          aws lambda wait function-updated --function-name "$FUNCTION"
